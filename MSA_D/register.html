<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSA Tune Studio | Create account</title>
  <meta name="description" content="Create a new MSA Tune Studio account with a polished sign-up experience.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="register-title">
      <div class="auth-brand">
        <div class="brand-mark">MS</div>
        <div>
          <p class="eyebrow">Join the studio</p>
          <h1>MSA Tune Studio</h1>
        </div>
      </div>

      <div class="auth-copy">
        <h2 id="register-title">Create your account</h2>
        <p>Set up your workspace quickly and start managing releases, analytics, and support.</p>
      </div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="field-group">
          <label for="fullName">Full name</label>
          <input id="fullName" name="name" type="text" autocomplete="name" placeholder="Ava Lane" required>
          <p class="inline-error" data-error-for="name"></p>
        </div>

        <div class="field-group">
          <label for="registerEmail">Email address</label>
          <input id="registerEmail" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
          <p class="inline-error" data-error-for="email"></p>
        </div>

        <div class="field-group">
          <label for="phoneNumber">Phone number (optional)</label>
          <input id="phoneNumber" name="phone" type="tel" autocomplete="tel" placeholder="+233 55 123 4567">
          <p class="inline-error" data-error-for="phone"></p>
        </div>

        <div class="field-group">
          <label for="registerPassword">Password</label>
          <div class="password-input">
            <input id="registerPassword" name="password" type="password" autocomplete="new-password" placeholder="Create a strong password" required>
            <button type="button" class="password-toggle" data-toggle="registerPassword">Show</button>
          </div>
          <p class="inline-error" data-error-for="password"></p>
        </div>

        <div class="field-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-input">
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" required>
            <button type="button" class="password-toggle" data-toggle="confirmPassword">Show</button>
          </div>
          <p class="inline-error" data-error-for="confirmPassword"></p>
        </div>

        <label class="checkbox-row" for="acceptTerms">
          <input id="acceptTerms" name="terms" type="checkbox" required>
          <span>I agree to the terms and privacy policy.</span>
        </label>
        <p class="inline-error" data-error-for="terms"></p>

        <button id="registerButton" class="primary-button auth-submit-button" type="submit">
          <span class="button-label">Create account</span>
          <span class="spinner" hidden></span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/MSA_D/login.html">Sign in</a></p>
      </div>

      <div id="registerMessage" class="auth-message" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('registerForm');
    const button = document.getElementById('registerButton');
    const messageBox = document.getElementById('registerMessage');

    function setInlineError(fieldName, text) {
      const target = document.querySelector(`[data-error-for="${fieldName}"]`);
      if (target) target.textContent = text || '';
    }

    function clearInlineErrors() {
      document.querySelectorAll('.inline-error').forEach((item) => {
        item.textContent = '';
      });
    }

    function showMessage(text, type = 'info') {
      messageBox.textContent = text;
      messageBox.className = `auth-message ${type}`;
    }

    function setBusy(isBusy) {
      button.disabled = isBusy;
      button.classList.toggle('is-loading', isBusy);
      const label = button.querySelector('.button-label');
      const spinner = button.querySelector('.spinner');
      if (label) label.textContent = isBusy ? 'Creating account...' : 'Create account';
      if (spinner) spinner.hidden = !isBusy;
    }

    document.querySelectorAll('.password-toggle').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const input = document.getElementById(toggle.getAttribute('data-toggle'));
        if (!input) return;
        const isSecret = input.type === 'password';
        input.type = isSecret ? 'text' : 'password';
        toggle.textContent = isSecret ? 'Hide' : 'Show';
      });
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearInlineErrors();
      showMessage('', 'info');

      const values = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim(),
        password: form.password.value,
        confirmPassword: form.confirmPassword.value,
        terms: form.terms.checked,
        role: 'Artist'
      };

      let hasError = false;
      if (!values.name) {
        setInlineError('name', 'Full name is required.');
        hasError = true;
      }
      if (!values.email) {
        setInlineError('email', 'Email is required.');
        hasError = true;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) {
        setInlineError('email', 'Please enter a valid email address.');
        hasError = true;
      }
      if (!values.password) {
        setInlineError('password', 'Password is required.');
        hasError = true;
      } else if (values.password.length < 8) {
        setInlineError('password', 'Password must be at least 8 characters.');
        hasError = true;
      }
      if (!values.confirmPassword) {
        setInlineError('confirmPassword', 'Please confirm your password.');
        hasError = true;
      } else if (values.password !== values.confirmPassword) {
        setInlineError('confirmPassword', 'Passwords do not match.');
        hasError = true;
      }
      if (!values.terms) {
        setInlineError('terms', 'You must accept the terms to continue.');
        hasError = true;
      }

      if (hasError) {
        showMessage('Please resolve the highlighted issues before continuing.', 'error');
        return;
      }

      setBusy(true);
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: values.name, email: values.email, password: values.password, role: 'Artist' }),
          credentials: 'include'
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          const message = payload?.message || payload?.error || 'Unable to create account.';
          showMessage(message, 'error');
          if (message.toLowerCase().includes('email')) {
            setInlineError('email', message);
          }
          setBusy(false);
          return;
        }

        window.location.replace('/MSA_D/login.html?registered=1');
      } catch (error) {
        showMessage('We could not reach the authentication service right now.', 'error');
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>

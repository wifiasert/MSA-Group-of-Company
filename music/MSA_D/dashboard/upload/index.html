<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1400, initial-scale=1">
  <title>Upload Music | MSA TUNE STUDIO</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body data-page="upload">
  <div class="studio-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-mark">MSA</div>
        <div><p class="eyebrow">MSA TUNE STUDIO</p><h1>MSA TUNE STUDIO</h1></div>
      </div>
      <nav class="sidebar-nav" aria-label="Studio navigation">
        <a class="nav-link" href="/music/MSA_D/dashboard/">Dashboard</a>
        <a class="nav-link active" href="/music/MSA_D/dashboard/upload/">Upload Music</a>
        <a class="nav-link" href="/music/MSA_D/dashboard/releases/">Releases</a>
        <a class="nav-link" href="/music/MSA_D/dashboard/analytics/">Analytics</a>
        <a class="nav-link" href="/music/MSA_D/dashboard/revenue/">Revenue</a>
        <a class="nav-link" href="/music/MSA_D/dashboard/support/">Support</a>
        <a class="nav-link" href="/music/MSA_D/dashboard/messages/">Messages</a>
        <a class="nav-link" href="/music/MSA_D/dashboard/notifications/">Notifications</a>
        <a class="nav-link" href="/music/MSA_D/dashboard/profile/">Profile</a>
        <a class="nav-link" href="/music/MSA_D/dashboard/settings/">Settings</a>
        <a class="nav-link" href="/music/MSA_D/dashboard/help/">Help Center</a>
      </nav>
      <a class="nav-link back-link" href="https://msagroupofcompanies.online/">← Back to Main Website</a>
    </aside>
    <main class="content-panel">
      <header class="topbar">
        <div><p class="eyebrow">Publishing</p><h2>Upload Music</h2><p class="muted">Add metadata, cover art, audio, and submit your release.</p></div>
        <div class="topbar-actions"><button class="ghost-button" id="themeToggle" type="button">☀︎</button><button class="primary-button" id="mobileToggle" type="button">Menu</button></div>
      </header>
      
      <div class="page-content">
        <section class="panel-card">
          <div class="panel-head"><h4>Release details</h4><span class="pill">Secure upload</span></div>
          <form class="form-grid" id="uploadForm">
            <label>Song title<input name="songTitle" required></label>
            <label>Artist name<input name="artistName" required></label>
            <label>Featured artists<input name="featuredArtists"></label>
            <label>Album<input name="album"></label>
            <label>Genre<input name="genre"></label>
            <label>Subgenre<input name="subgenre"></label>
            <label>Language<input name="language"></label>
            <label>Composer<input name="composer"></label>
            <label>Producer<input name="producer"></label>
            <label>Release date<input type="date" name="releaseDate"></label>
            <label>UPC placeholder<input name="upc" placeholder="UPC-0001"></label>
            <label>ISRC placeholder<input name="isrc" placeholder="ISRC-0001"></label>
            <label class="full-span">Lyrics<textarea name="lyrics" rows="3"></textarea></label>
            <label class="full-span">Credits<textarea name="credits" rows="3"></textarea></label>
            <label class="full-span">Territories<textarea name="territories" rows="3" placeholder="US, UK, GH"></textarea></label>
            <label class="full-span">Rights information<textarea name="rights" rows="3"></textarea></label>
            <label class="check-row"><input type="checkbox" name="explicit"> Explicit content</label>
            <div class="form-actions full-span"><button class="primary-button" type="submit">Save & submit</button><button class="ghost-button" type="button" id="saveDraft">Save draft</button></div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="../../app.js"></script>
  <script src="../../lib/platform.js"></script>
</body>
</html>
